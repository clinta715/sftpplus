<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Backend Interaction</title>
</head>
<body>
    <h1>Backend Interaction</h1>

    <button onclick="executeCommand('list_lock_files')">List Lock Files</button>
    <button onclick="executeCommand('list_log_files')">List Log Files</button>

    <h2>Log File Content</h2>
    <input type="text" id="logFileName" placeholder="Enter log file name">
    <button onclick="showLogContent()">Show Log Content</button>
    <div id="logContent"></div>

    <h2>Crontab</h2>
    <button onclick="executeCommand('show_crontab')">Show Crontab</button>
    <pre id="crontabContent"></pre>

    <script>
        function executeCommand(command) {
            fetch('/execute', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: `command=${command}`
            })
            .then(response => response.text())
            .then(data => alert(data))
            .catch(error => console.error('Error:', error));
        }

        function showLogContent() {
            const logFileName = document.getElementById('logFileName').value;
            if (logFileName) {
                executeCommand(`show_log_content:${logFileName}`);
            } else {
                alert('Please enter a log file name.');
            }
        }

        function displayContent(content) {
            document.getElementById('logContent').textContent = content;
        }

        function displayCrontab(content) {
            document.getElementById('crontabContent').textContent = content;
        }
    </script>
</body>
</html>
