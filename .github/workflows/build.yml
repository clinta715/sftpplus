name: Build and Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install PySide6 paramiko cryptography
      
      - name: Build macOS executable
        run: |
          pyinstaller --windowed \
                      --onedir \
                      --name "SFTP Client" \
                      --exclude-module "tkinter" \
                      --exclude-module "matplotlib" \
                      --exclude-module "numpy" \
                      --exclude-module "pandas" \
                      --exclude-module "scipy" \
                      --exclude-module "PIL" \
                      --exclude-module "cv2" \
                      --exclude-module "pytest" \
                      --hidden-import "PySide6.QtCore" \
                      --hidden-import "PySide6.QtGui" \
                      --hidden-import "PySide6.QtWidgets" \
                      --hidden-import "paramiko" \
                      --hidden-import "cryptography" \
                      --hidden-import "cryptography.fernet" \
                      sftp.py
      
      - name: Create DMG-like archive
        run: |
          cd dist
          tar -czf "SFTP-Client-macOS-x86_64.tar.gz" "SFTP Client.app"
          ls -lh
      
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTP-Client-macOS
          path: dist/SFTP-Client-macOS-x86_64.tar.gz

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install PySide6 paramiko cryptography
      
      - name: Build Windows executable
        run: |
          pyinstaller --windowed `
                      --onedir `
                      --name "SFTP Client" `
                      --collect-all "PySide6" `
                      --collect-all "paramiko" `
                      --collect-all "cryptography" `
                      --exclude-module "tkinter" `
                      --exclude-module "matplotlib" `
                      --exclude-module "numpy" `
                      --exclude-module "pandas" `
                      --exclude-module "scipy" `
                      --exclude-module "PIL" `
                      --exclude-module "cv2" `
                      --exclude-module "pytest" `
                      --hidden-import "PySide6.QtCore" `
                      --hidden-import "PySide6.QtGui" `
                      --hidden-import "PySide6.QtWidgets" `
                      --hidden-import "paramiko" `
                      --hidden-import "cryptography" `
                      --hidden-import "cryptography.fernet" `
                      --hidden-import "paramiko.win_openssh" `
                      sftp.py
      
      - name: Create Windows ZIP
        run: |
          Compress-Archive -Path "dist/SFTP Client" -DestinationPath "dist/SFTP-Client-Windows.zip"
      
      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTP-Client-Windows
          path: dist/SFTP-Client-Windows.zip

  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: |
          pip install pyinstaller
          pip install PySide6 paramiko cryptography
      
      - name: Build Linux executable
        run: |
          pyinstaller --windowed \
                      --onefile \
                      --name "sftp-client" \
                      --exclude-module "tkinter" \
                      --exclude-module "matplotlib" \
                      --exclude-module "numpy" \
                      --exclude-module "pandas" \
                      --exclude-module "scipy" \
                      --exclude-module "PIL" \
                      --exclude-module "cv2" \
                      --exclude-module "pytest" \
                      --hidden-import "PySide6.QtCore" \
                      --hidden-import "PySide6.QtGui" \
                      --hidden-import "PySide6.QtWidgets" \
                      --hidden-import "paramiko" \
                      --hidden-import "cryptography" \
                      --hidden-import "cryptography.fernet" \
                      --hidden-import "pty" \
                      --hidden-import "fcntl" \
                      --hidden-import "termios" \
                      sftp.py
      
      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: SFTP-Client-Linux
          path: dist/sftp-client

  create-release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
      
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./release
      
      - name: List artifacts
        run: ls -R ./release
      
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: SFTP Client ${{ github.ref_name }}
          body: |
            ## SFTP Client ${{ github.ref_name }}
            
            A multi-tabbed, ephemeral-connection based graphical SFTP client.
            
            ### Features
            - Cross-platform: Windows, macOS, Linux
            - Multi-tabbed interface for multiple servers
            - SSH Terminal support (macOS/Linux)
            - Drag and drop file transfers
            - Progress tracking with overall meter
            - Local terminal (macOS/Linux)
            - File preview panel
            - Customizable toolbar
            - Bookmarks and tree view
            
            ### Downloads
            | Platform | File |
            |----------|------|
            | macOS | `SFTP-Client-macOS-x86_64.tar.gz` |
            | Windows | `SFTP Client.exe` |
            | Linux | `sftp-client` |
            
            ### Requirements
            - No Python installation required (standalone executables)
            
            ### Notes
            - macOS: Extract and run the .app bundle
            - Windows: Run SFTP Client.exe directly
            - Linux: Make executable with `chmod +x sftp-client` then run
          files: |
            ./release/SFTP-Client-macOS/SFTP-Client-macOS-x86_64.tar.gz
            ./release/SFTP-Client-Windows/SFTP Client.exe
            ./release/SFTP-Client-Linux/sftp-client
          draft: false
          prerelease: false